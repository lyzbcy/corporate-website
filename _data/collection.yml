# 藏品库数据 —— 捞鱼工作室收藏陈列
#
# 新增藏品的步骤（详见 AGENTS.md「藏品库」节）：
#   1. 在 items 里加一条记录（id 不与现有重复；shelf 指定放第几层货架）
#   2. figure 对应 _includes/vault/ 下的一个 SVG 文件名（不含扩展名）
#      ——新藏品优先复用现有 figure；自制新 figure 时注意 SVG 内渐变 id 全页唯一
#   3. placeholder: true 的是「待入库」占位展品，点击只会有摇晃动画，不弹详情
#
# 字段说明：
#   no          藏品编号（展示用）
#   plaque_name / plaque_sub   货架下方铭牌的两行文字
#   collected   入库日期
#   rarity      稀有度（展示用星级）
#   storage     存档位置（仓库内路径）
#   story       详情弹窗正文，一段一条
#   actions     详情弹窗按钮组，icon 用 Font Awesome 类名

