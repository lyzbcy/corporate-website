    story:
      - 这本技能书来自一段从需求理解、双端开发走到灰度回归的协作经历。查重、客户阶段、员工状态和任务配置，既要能用，也要知道哪些结果真正被验证过。
      - 多层弹窗分清草稿与保存，异步校验对应当前输入，状态失败保留确认值；交付时再核实际构建，而不是把代码推送当成上线。这些判断从真实问题中整理出来，也保留了越界改动需要精确撤回的教训。
      - 1.1版保留QV目录映射、微盛组件接入、五个模块的字段和实施手册，并带接入配置、项目初始化脚本、回归CSV和可运行的异步状态样例。下载后先映射新工程，再生成本地实施资料和逐项回归，不用从一页原则重新猜怎么做。
      - 脱敏去掉的是客户数据、内网地址和凭据；保留可复用工程能力。包内样例使用虚构数据，不是公司源码，也不代替目标项目的真实接口与权限验证。
